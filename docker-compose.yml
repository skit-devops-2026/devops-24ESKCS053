version: "3.9"

services:
  web:
    build: .
    container_name: task-manager-app
    restart: always
    ports:
      - "8080:80"
    networks:
      - app-net

  prometheus:
    image: prom/prometheus:latest
    container_name: task-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-net

  grafana:
    image: grafana/grafana:latest
    container_name: task-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - app-net

networks:
  app-net:
    driver: bridge